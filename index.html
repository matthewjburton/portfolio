<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link
      rel="mask-icon"
      href="/favicon/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />

    <script
      src="https://kit.fontawesome.com/b3382d9189.js"
      crossorigin="anonymous"
    ></script>

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Matthew Burton</title>

    <meta
      name="description"
      content="Matthew Burton — full-stack developer and game designer. I ship production tools and indie games."
    />
    <meta name="author" content="Matthew Burton" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Matthew Burton" />
    <meta property="og:title" content="Matthew Burton — Developer & Game Designer" />
    <meta
      property="og:description"
      content="Full-stack developer and game designer. I ship production tools and indie games."
    />
    <meta
      property="og:url"
      content="https://matthewjburton.github.io/portfolio/"
    />
    <meta
      property="og:image"
      content="https://matthewjburton.github.io/portfolio/images/about/portrait.webp"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Matthew Burton — Developer & Game Designer"
    />
    <meta
      name="twitter:description"
      content="Full-stack developer and game designer. I ship production tools and indie games."
    />
    <meta
      name="twitter:image"
      content="https://matthewjburton.github.io/portfolio/images/about/portrait.webp"
    />
    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        var isDark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#0b0b0b';
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
